<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NAME.exe - Your Name Has Escaped!</title>
<meta name="description" content="Your own name tries to escape from you. Can you catch every letter?">
<style>
  :root { --bg:#120b2e; --bg2:#2b1166; --accent:#ffd23f; --pink:#ff4fa3; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:#fff; overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  #stage { position:fixed; inset:0; touch-action:none; user-select:none; -webkit-user-select:none; --s:70px;
    background:radial-gradient(1200px 800px at 50% 15%, var(--bg2), var(--bg)); }
  #field, #slots { position:absolute; inset:0; }
  #slots { opacity:0; transition:opacity .4s; pointer-events:none; }
  #slots.show { opacity:1; }
  .slot { position:absolute; left:0; top:0; width:var(--s); height:calc(var(--s)*1.15);
    border:3px dashed rgba(255,255,255,.3); border-radius:28%; }
  .slot::after { content:attr(data-ch); position:absolute; left:0; right:0; bottom:2%; text-align:center;
    font-weight:900; font-size:calc(var(--s)*.58); line-height:1; color:rgba(255,255,255,.14); }
  .slot.ok { border-color:transparent; }
  .slot.ok::after { content:""; }

  /* ---- characters ---- */
  .tile { position:absolute; left:0; top:0; width:var(--s); height:calc(var(--s)*1.15); z-index:2;
    will-change:transform; cursor:grab; touch-action:none; transform-origin:50% 100%; }
  .tile.hiding { z-index:0; }
  .face { position:absolute; inset:0; border-radius:28%; background:var(--c); transition:transform .12s;
    box-shadow:0 6px 0 rgba(0,0,0,.25), inset 0 -6px 0 rgba(0,0,0,.12); }
  .eyes { position:absolute; top:12%; left:0; right:0; display:flex; justify-content:center; gap:calc(var(--s)*.08); }
  .eyes i { --e:calc(var(--s)*.27); width:var(--e); height:var(--e); background:#fff; border-radius:50%;
    position:relative; overflow:hidden; transition:height .15s, margin-top .15s; }
  .eyes b { position:absolute; left:50%; top:50%; width:48%; height:48%; background:#1b1230; border-radius:50%;
    transform:translate(calc(-50% + var(--px,0px)), calc(-50% + var(--py,0px))); }
  .g { position:absolute; left:0; right:0; bottom:2%; text-align:center; font-weight:900; line-height:1;
    font-size:calc(var(--s)*.58); color:#fff; text-shadow:0 3px 0 rgba(0,0,0,.25); }
  .mouth { position:absolute; left:50%; top:37%; width:calc(var(--s)*.26); height:calc(var(--s)*.1);
    transform:translateX(-50%); border-bottom:3px solid #1b1230; border-radius:0 0 60% 60%; transition:all .1s; }
  .mo .mouth { width:calc(var(--s)*.15); height:calc(var(--s)*.15); border:0; background:#5a1030; border-radius:50%; top:36%; }
  .mg .mouth { width:calc(var(--s)*.32); height:calc(var(--s)*.14); border:0; background:#5a1030; border-radius:0 0 100px 100px; }
  .mz .mouth { width:calc(var(--s)*.12); height:2px; border:0; background:#1b1230; border-radius:2px; top:40%; }
  .zzz { display:none; position:absolute; top:-14%; right:-4%; font-style:normal; font-weight:800;
    font-size:calc(var(--s)*.3); animation:zz 1.6s ease-in-out infinite; }
  .asleep .zzz { display:block; }
  .asleep .eyes i { height:4px; margin-top:calc(var(--s)*.1); }
  .asleep .eyes b { opacity:0; }
  .dizzy .eyes b, .faint .eyes b { opacity:0; }
  .dizzy .eyes i::after, .faint .eyes i::after { content:"\00d7"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:calc(var(--s)*.3); font-weight:900; color:#1b1230; }
  .faint .face { transform:rotate(82deg) translateY(6%); }          /* knocked out: lying on its side */
  .faint .mouth { width:calc(var(--s)*.15); height:calc(var(--s)*.15); border:0; background:#5a1030; border-radius:50%; top:36%; }
  .faint .zzz { display:block; }
  .dizzy::before { content:"\1F4AB"; position:absolute; left:50%; top:-30%; margin-left:calc(var(--s)*-.2);
    font-size:calc(var(--s)*.4); animation:spin .6s linear infinite; z-index:3; }
  .legs { position:absolute; left:0; right:0; top:96%; display:flex; justify-content:center; gap:calc(var(--s)*.24); pointer-events:none; }
  .legs u { display:block; width:calc(var(--s)*.1); height:calc(var(--s)*.17); background:#1b1230; border-radius:4px; transform-origin:50% 0; }
  .running .legs u:nth-child(1) { animation:leg .15s linear infinite; }
  .running .legs u:nth-child(2) { animation:leg .15s linear infinite -.075s; }
  .placed .legs, .hiding .legs { display:none; }
  .say { position:absolute; left:50%; bottom:118%; transform:translateX(-50%) scale(.5); opacity:0; pointer-events:none;
    background:#fff; color:#1b1230; font-weight:800; font-size:15px; padding:6px 12px; border-radius:14px;
    white-space:nowrap; transition:opacity .12s, transform .12s; z-index:6; box-shadow:0 3px 10px rgba(0,0,0,.3); }
  .say.big { font-size:22px; padding:8px 16px; }
  .say::after { content:""; position:absolute; left:50%; top:100%; margin-left:-5px; border:5px solid transparent; border-top-color:#fff; }
  .say.on { opacity:1; transform:translateX(-50%) scale(1); }
  .held { z-index:5; }
  .held .face { transform:scale(1.14) rotate(-4deg); }
  .shake .face { animation:shake .12s linear infinite; }
  .pop .face { animation:popin .35s cubic-bezier(.2,1.5,.4,1) both; animation-delay:var(--d,0s); }
  .placed { cursor:default; }
  .placed .face { animation:pop .4s; }
  .placed.cheer .face { animation:cheer .5s ease-in-out 3; }
  @keyframes shake { 0%,100% { transform:rotate(-5deg); } 50% { transform:rotate(5deg); } }
  @keyframes pop { 0% { transform:scale(1.3); } 60% { transform:scale(.92); } 100% { transform:scale(1); } }
  @keyframes popin { 0% { transform:scale(0); } 100% { transform:scale(1); } }
  @keyframes cheer { 0%,100% { transform:translateY(0) scale(1); } 40% { transform:translateY(-34%) scale(1.08,.94); } }
  @keyframes zz { 0%,100% { transform:translateY(0); opacity:.9; } 50% { transform:translateY(-8px); opacity:.4; } }
  @keyframes leg { 0%,100% { transform:rotate(28deg); } 50% { transform:rotate(-28deg); } }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* ---- the fake cookie banner (the Hider's hiding spot) ---- */
  .cookie { position:absolute; left:0; top:0; z-index:1; opacity:0; }
  .cookie.in { opacity:1; }
  .ck { position:absolute; inset:0; background:#fff; color:#1b1230; border-radius:14px; padding:6px 12px;
    display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:12px; font-weight:700;
    box-shadow:0 8px 24px rgba(0,0,0,.45); cursor:pointer; }
  .cookie.in .ck { animation:ckIn .4s cubic-bezier(.2,1.5,.4,1); }
  .cookie.fall .ck { animation:ckFall .7s ease-in forwards; }
  .ck span { white-space:nowrap; font-size:12px; }
  .ck b { background:var(--accent); border-radius:999px; padding:7px 11px; font-size:12px; white-space:nowrap; }
  @keyframes ckIn { from { transform:translateY(-120px) scale(.9); opacity:0; } to { transform:none; opacity:1; } }
  @keyframes ckFall { to { transform:translateY(130vh) rotate(28deg); opacity:.2; } }
  .bonk { position:absolute; font-weight:900; font-size:22px; color:var(--accent); text-shadow:0 3px 0 #000; white-space:nowrap;
    pointer-events:none; animation:bonk .9s ease-out forwards; z-index:7; }
  @keyframes bonk { from { transform:translateY(0) scale(.6); opacity:1; } to { transform:translateY(-44px) scale(1.25); opacity:0; } }

  #banner { position:fixed; left:0; right:0; top:20%; text-align:center; padding:0 16px; pointer-events:none;
    font-weight:900; font-size:clamp(28px,8vw,64px); text-shadow:0 4px 0 rgba(0,0,0,.35); opacity:0; z-index:20; }
  #banner.show { animation:bannerIn var(--dur,1.4s) ease both; }
  @keyframes bannerIn { 0% { opacity:0; transform:scale(.6); } 12% { opacity:1; transform:scale(1.08); }
    20% { transform:scale(1); } 80% { opacity:1; } 100% { opacity:0; } }

  #hud { position:fixed; top:12px; left:16px; right:16px; display:flex; justify-content:space-between;
    align-items:center; z-index:10; pointer-events:none; opacity:0; transition:opacity .3s; }
  #hud.show { opacity:1; }
  .mono { font-family:ui-monospace,Consolas,monospace; font-weight:700; color:var(--accent); }
  #hint { position:fixed; bottom:10px; left:0; right:0; text-align:center; font-size:12px; opacity:0; transition:opacity .4s; pointer-events:none; }
  #hint.show { opacity:.65; }

  .btn { appearance:none; border:0; border-radius:999px; padding:12px 22px; font:inherit; font-weight:700;
    background:var(--accent); color:#2a1a00; cursor:pointer; text-decoration:none; display:inline-block; }
  .btn.ghost { background:rgba(255,255,255,.14); color:#fff; }
  .btn:focus-visible, input:focus-visible { outline:3px solid #fff; outline-offset:2px; }
  #snd { pointer-events:auto; padding:6px 12px; font-size:14px; }

  #intro { position:fixed; inset:0; z-index:30; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:14px; padding:24px; text-align:center; transition:opacity .4s; }
  #intro.hide { opacity:0; pointer-events:none; }
  #intro h1 { margin:0; font-size:clamp(20px,5vw,30px); opacity:0; animation:fadeUp .6s .2s forwards; }
  #intro h2 { margin:0; font-size:clamp(26px,7vw,44px); opacity:0; animation:fadeUp .6s 1.3s forwards; }
  #form { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; opacity:0; animation:fadeUp .6s 2.1s forwards; }
  #nameIn { width:min(78vw,300px); font:inherit; font-size:20px; font-weight:700; padding:12px 18px; border-radius:999px;
    border:3px solid rgba(255,255,255,.3); background:rgba(255,255,255,.1); color:#fff; text-align:center; }
  #nameIn::placeholder { color:rgba(255,255,255,.45); }
  #note { min-height:20px; font-size:13px; color:var(--pink); margin:0; }
  .tag { font-family:ui-monospace,Consolas,monospace; color:var(--accent); letter-spacing:1px; font-size:13px; opacity:.8; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }

  #card { position:fixed; inset:0; z-index:40; display:none; flex-direction:column; align-items:center;
    justify-content:center; gap:14px; padding:16px; background:rgba(10,6,30,.93); }
  #card.show { display:flex; }
  #cardImg { max-height:64vh; max-width:92vw; border-radius:16px; box-shadow:0 12px 40px rgba(0,0,0,.5); }
  #cardBtns { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  #fx { position:fixed; inset:0; pointer-events:none; z-index:25; }
</style>
</head>
<body>
<div id="stage">
  <div id="slots"></div>
  <div id="field"></div>
</div>
<canvas id="fx"></canvas>
<div id="banner"></div>
<div id="hud"><span class="mono" id="timer">0.0s</span><button class="btn ghost" id="snd" aria-label="Toggle sound">Sound: off</button></div>
<div id="hint">Drag each letter back into its slot</div>

<div id="intro">
  <div class="tag">NAME.exe</div>
  <h1>&#9888;&#65039; Someone stole your identity.</h1>
  <h2>What's your name?</h2>
  <form id="form" autocomplete="off">
    <input id="nameIn" type="text" maxlength="24" placeholder="Type your name" aria-label="Your name" enterkeyhint="go">
    <button class="btn" type="submit">Find it</button>
  </form>
  <p id="note" role="status"></p>
</div>

<div id="card" role="dialog" aria-label="Your result card">
  <img id="cardImg" alt="Your personalised result card">
  <div id="cardBtns">
    <a class="btn" id="dl" download="name-recovered.png">Download card</a>
    <button class="btn ghost" id="again" type="button">Try another name</button>
  </div>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const stage = $('#stage'), field = $('#field'), slotsEl = $('#slots'), banner = $('#banner');
  const hud = $('#hud'), timerEl = $('#timer'), hint = $('#hint'), sndBtn = $('#snd');
  const intro = $('#intro'), form = $('#form'), nameIn = $('#nameIn'), note = $('#note');
  const card = $('#card'), cardImg = $('#cardImg'), dl = $('#dl'), again = $('#again');
  const fx = $('#fx'), fctx = fx.getContext('2d');

  const COLORS = ['#ff6b6b', '#ffa94d', '#ffd43b', '#69db7c', '#4dabf7', '#9775fa', '#f783ac', '#38d9a9', '#ff8787', '#74c0fc'];
  const ROLE_ORDER = ['screamer', 'dramaqueen', 'hider', 'faker'];   // everyone else is a follower
  const MAX_LETTERS = 10;
  const SITE_LINE = 'Your name tried to escape. Did yours?';

  let letters = [], slots = [], state = 'intro', grab = null, twistDone = false, gameId = 0, cookie = null;
  let W = 0, H = 0, size = 70, rows = 1, perRow = 4, startT = 0, graceUntil = 0, shownName = '';
  const pointer = { x: -999, y: -999, active: false };
  const parts = [];

  // ---------- sound (optional, off by default) ----------
  let sound = false, ac = null;
  function getAC() {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  function tone(f, d = .12, type = 'sine', v = .14) {
    if (!sound) return;
    try {
      const a = getAC(), t = a.currentTime, o = a.createOscillator(), g = a.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
      o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + .02);
    } catch (e) { /* audio unavailable */ }
  }
  // A pitch slide with optional vibrato. Every cartoon sound below is built from these two helpers.
  function sweep(f0, f1, d, o = {}) {
    const a = getAC(), t = a.currentTime + (o.delay || 0), os = a.createOscillator(), g = a.createGain();
    os.type = o.type || 'square';
    os.frequency.setValueAtTime(f0, t); os.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + d);
    if (o.vib) {
      const l = a.createOscillator(), lg = a.createGain();
      l.frequency.value = o.vib; lg.gain.value = f0 * .08; l.connect(lg); lg.connect(os.frequency); l.start(t); l.stop(t + d + .02);
    }
    const v = o.v || .09;
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.0005, t + d);
    os.connect(g); g.connect(a.destination); os.start(t); os.stop(t + d + .02);
  }
  function noise(d, v = .08, delay = 0) {
    const a = getAC(), len = Math.floor(a.sampleRate * d), buf = a.createBuffer(1, len, a.sampleRate), data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = a.createBufferSource(), g = a.createGain(); s.buffer = buf; g.gain.value = v;
    s.connect(g); g.connect(a.destination); s.start(a.currentTime + delay);
  }
  const FX = {
    laugh: b => { for (let i = 0; i < 3; i++) sweep(b * 1.4, b * 1.1, .08, { delay: i * .11, v: .08 }); },   // heh heh heh
    scream: b => sweep(b * 1.5, b * 2.4, .35, { vib: 18, v: .08 }),                                      // warbling panic
    boing: b => sweep(b * .8, b * 1.8, .28, { type: 'sine', vib: 9, v: .16 }),
    slidedown: b => sweep(b * 1.6, b * .4, .45, { type: 'triangle', v: .16 }),                           // slide whistle
    wahwah: b => {                                                                                       // sad trombone
      sweep(b * 1.2, b * .9, .14, { type: 'sawtooth', v: .06 });
      sweep(b * 1.0, b * .75, .14, { type: 'sawtooth', v: .06, delay: .16 });
      sweep(b * .8, b * .4, .35, { type: 'sawtooth', v: .06, delay: .32 });
    },
    yawn: b => sweep(b * 1.3, b * .5, .6, { type: 'sine', v: .14, vib: 6 }),
    whoop: b => sweep(b * .7, b * 2.6, .3, { type: 'square', v: .07 }),
    tada: b => {
      sweep(b * 1.2, b * 1.2, .1, { type: 'triangle', v: .14 });
      sweep(b * 1.5, b * 1.5, .1, { type: 'triangle', v: .14, delay: .1 });
      sweep(b * 2, b * 2, .25, { type: 'triangle', v: .14, delay: .2 });
    },
    tiptoe: b => { sweep(b * .5, b * .45, .07, { type: 'triangle', v: .16 }); sweep(b * .45, b * .4, .07, { type: 'triangle', v: .16, delay: .22 }); },
    scratch: b => { noise(.25, .12); sweep(b * 1.5, b * .3, .3, { type: 'sawtooth', v: .07 }); },         // record scratch
    evil: b => [1.2, 1, .85, .7].forEach((m, i) => sweep(b * m, b * m * .9, .14, { type: 'sawtooth', v: .07, delay: i * .15 })),
    sus: b => sweep(b * .6, b * .5, .5, { type: 'sine', vib: 7, v: .14 }),
    bonk: b => sweep(b * .5, b * .2, .2, { type: 'sine', v: .2 })
  };
  const KIND_FX = { flee: 'laugh', scared: 'scream', grab: 'boing', wake: 'yawn', faker: 'laugh', trick: 'laugh', free: 'whoop',
    ow: 'wahwah', hey: 'slidedown', hider: 'tiptoe', busted: 'scratch', placed: 'tada', cheer: 'tada', run: 'whoop',
    sus: 'sus', still: 'bonk', twist: 'evil', faint: 'slidedown', faintwake: 'yawn', bump: 'wahwah' };
  function voice(L, kind) {                  // each letter has its own pitch, so M and A sound different
    if (!sound) return;
    const base = 220 + ((L.ch.codePointAt(0) || 65) % 13) * 30;
    try { FX[KIND_FX[kind] || 'boing'](base); } catch (e) { /* audio unavailable */ }
  }
  sndBtn.addEventListener('click', () => {
    sound = !sound; sndBtn.textContent = 'Sound: ' + (sound ? 'on' : 'off');
    if (sound) tone(660, .1);
  });

  // ---------- speech ----------
  const QUIPS = {
    flee: ['Nope!', 'Catch me!', 'Too slow!', 'Not today!', 'Bye!', "Can't touch this", 'Wheee!'],
    scared: ['AAAH!', "Don't look at me!", 'HELP!', 'Is that the cursor?!', 'I have a family!'],
    grab: ['Put me down!', 'Unhand me!', 'Rude!', 'I have rights!', 'Not the face!'],
    wake: ['5 more minutes...', 'Huh? Who?', 'I was sleeping!'],
    faker: ['Just kidding!', 'Tricked ya!', 'Was I snoring?', 'Nap time is over!'],
    free: ["I'M FREE!"], ow: ['Ow.', 'My letter!'], hey: ['HEY!', 'Watch it!', 'Rude!'],
    hider: ['You saw nothing.'], busted: ['Okay, you saw something.', 'Not the cookie!', 'I was never here.'],
    placed: ['Fine...', 'Ugh, home.', 'Back in line.', 'Okay okay!', 'Happy now?'],
    cheer: ['YES!', 'We did it!', 'Home sweet home!', 'Group hug!', 'Best name ever!'],
    sus: ['...is that a cursor?'], still: ['Nobody move.'], run: ['RUN!!!'], twist: ['NOT SO FAST!'],
    faint: ['x_x', 'Lights out...', 'Tell my mom...', 'Ouch. The wall.'],
    faintwake: ['Huh? What happened?', 'Who turned off the lights?', 'I saw stars...'],
    bump: ['Watch it!', 'Ow, my corner!', 'Hey, I was running!', 'Sorry! ...not sorry']
  };
  const pick = a => a[Math.floor(Math.random() * a.length)];
  function talk(L, kind, force, big) {
    const now = performance.now();
    if (!force && now < L.nextTalk) return;
    L.nextTalk = now + 2400 + Math.random() * 1600;
    const b = L.el.querySelector('.say');
    b.textContent = pick(QUIPS[kind]); b.classList.toggle('big', !!big); b.classList.add('on'); voice(L, kind);
    b.style.marginLeft = '0px';             // keep the bubble inside the screen, even for a letter at the edge
    const bw = b.offsetWidth, left = L.x + size / 2 - bw / 2;
    let shift = 0; if (left < 6) shift = 6 - left; else if (left + bw > W - 6) shift = W - 6 - (left + bw);
    b.style.marginLeft = Math.round(shift) + 'px';
    clearTimeout(L.tt); L.tt = setTimeout(() => b.classList.remove('on'), force ? 1400 : 1000);
  }
  function say(text, ms = 1400) {
    banner.textContent = text;
    banner.style.setProperty('--dur', ms + 'ms');
    banner.classList.remove('show'); void banner.offsetWidth; banner.classList.add('show');
  }
  function bonk(x, y, text = 'BONK!') {
    const e = document.createElement('div'); e.className = 'bonk'; e.textContent = text;
    // sits to the upper-right of the hit so it never covers the letter or its speech bubble
    e.style.left = Math.max(4, Math.min(W - 90, x + size * .35)) + 'px'; e.style.top = Math.max(70, y - size * .75) + 'px'; field.appendChild(e);
    setTimeout(() => e.remove(), 950);
  }
  function parseName(raw) {
    const segs = (window.Intl && Intl.Segmenter)
      ? [...new Intl.Segmenter(undefined, { granularity: 'grapheme' }).segment(raw)].map(s => s.segment)
      : Array.from(raw);
    return segs.filter(ch => /[\p{L}\p{N}]/u.test(ch)).map(c => c.toUpperCase());
  }

  // ---------- build + layout ----------
  function build(chars) {
    field.innerHTML = ''; slotsEl.innerHTML = ''; letters = []; slots = []; cookie = null;
    const n = chars.length, roles = new Array(n).fill('follower');
    const idx = chars.map((_, i) => i).sort(() => Math.random() - .5);
    ROLE_ORDER.slice(0, Math.min(4, n)).forEach((r, k) => { roles[idx[k]] = r; });
    chars.forEach((ch, i) => {
      const el = document.createElement('div');
      el.className = 'tile';
      el.style.setProperty('--c', COLORS[i % COLORS.length]);
      el.innerHTML = '<div class="legs"><u></u><u></u></div><div class="face"><div class="eyes"><i><b></b></i><i><b></b></i></div><div class="mouth"></div><span class="g"></span><em class="zzz">z</em></div><div class="say"></div>';
      el.querySelector('.g').textContent = ch;
      field.appendChild(el);

    const secs = (performance.now() - startT) / 1000;
    hint.classList.remove('show');
    say('RECOVERED! 🎉', 2000); burst();
    letters.forEach((L, i) => setTimeout(() => { if (gameId !== gid) return; L.el.classList.add('cheer'); talk(L, 'cheer', true); }, i * 90));
    [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, .25, 'triangle'), i * 120));
    setTimeout(() => { if (gameId === gid) showCard(secs); }, 2500);
  }

  function rr(x, px, py, w, h, r, fill) {
    x.beginPath(); x.moveTo(px + r, py); x.arcTo(px + w, py, px + w, py + h, r); x.arcTo(px + w, py + h, px, py + h, r);
    x.arcTo(px, py + h, px, py, r); x.arcTo(px, py, px + w, py, r); x.closePath(); x.fillStyle = fill; x.fill();
  }
  function titleFor(secs) {
    if (secs < 12) return 'Fastest Hands in the Alphabet';
    if (secs < 25) return 'Certified Name Wrangler';
    return 'Patient Letter Whisperer';
  }
  function drawCard(secs) {
    const c = document.createElement('canvas'); c.width = 1080; c.height = 1350;
    const x = c.getContext('2d');
    const g = x.createLinearGradient(0, 0, 0, 1350); g.addColorStop(0, '#2b1166'); g.addColorStop(1, '#120b2e');
    x.fillStyle = g; x.fillRect(0, 0, 1080, 1350);
    for (let i = 0; i < 70; i++) { x.fillStyle = COLORS[i % COLORS.length]; x.globalAlpha = .35;
      x.fillRect((i * 389) % 1080, (i * 211) % 1350, 10, 16); }
    x.globalAlpha = 1; x.textAlign = 'center';
    x.fillStyle = '#ffd23f'; x.font = '700 52px ui-monospace,Consolas,monospace'; x.fillText('NAME.exe', 540, 130);
    x.fillStyle = '#fff'; x.font = '800 46px system-ui,Segoe UI,sans-serif'; x.fillText('IDENTITY RECOVERED', 540, 210);
    const n = letters.length, ts = Math.min(150, 920 / (n * 1.16)), gp = ts * .16;
    const sx = (1080 - (n * ts + (n - 1) * gp)) / 2, ty = 330;
    letters.forEach((L, i) => {
      const px = sx + i * (ts + gp);
      rr(x, px, ty + 8, ts, ts * 1.15, ts * .28, 'rgba(0,0,0,.28)');
      rr(x, px, ty, ts, ts * 1.15, ts * .28, L.color);
      [.32, .68].forEach(f => {
        x.fillStyle = '#fff'; x.beginPath(); x.arc(px + ts * f, ty + ts * .27, ts * .13, 0, 7); x.fill();
        x.fillStyle = '#1b1230'; x.beginPath(); x.arc(px + ts * f, ty + ts * .28, ts * .06, 0, 7); x.fill();
      });
      x.fillStyle = '#fff'; x.font = `900 ${ts * .58}px system-ui,Segoe UI,sans-serif`; x.fillText(L.ch, px + ts / 2, ty + ts * 1.04);
    });
    x.fillStyle = '#fff'; x.font = '900 72px system-ui,Segoe UI,sans-serif';
    let nm = shownName; while (x.measureText(nm).width > 940 && nm.length > 3) nm = nm.slice(0, -1);
    x.fillText(nm, 540, 640);
    x.fillStyle = '#ff4fa3'; x.font = '800 54px system-ui,Segoe UI,sans-serif'; x.fillText(titleFor(secs), 540, 760);
    x.fillStyle = 'rgba(255,255,255,.85)'; x.font = '600 40px system-ui,Segoe UI,sans-serif';
    x.fillText(`Caught every letter in ${secs.toFixed(1)}s`, 540, 850);
    x.fillStyle = '#ffd23f'; x.font = '700 38px system-ui,Segoe UI,sans-serif'; x.fillText(SITE_LINE, 540, 1230);
    return c;
  }
  let cardUrl = null;
  function showCard(secs) {
    drawCard(secs).toBlob(blob => {
      if (!blob) return;
      if (cardUrl) URL.revokeObjectURL(cardUrl);
      cardUrl = URL.createObjectURL(blob);
      cardImg.src = cardUrl; dl.href = cardUrl;
      dl.download = (shownName.replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-|-$/g, '') || 'name') + '-recovered.png';
      card.classList.add('show');
    }, 'image/png');
  }
  again.addEventListener('click', () => {
    card.classList.remove('show'); gameId++;
    state = 'intro'; letters = []; slots = []; cookie = null; field.innerHTML = ''; slotsEl.innerHTML = '';
    slotsEl.classList.remove('show'); hud.classList.remove('show'); hint.classList.remove('show');
    intro.classList.remove('hide'); nameIn.value = ''; note.textContent = '';
    setTimeout(() => { try { nameIn.focus({ preventScroll: true }); } catch (e) {} }, 100);
  });

  // ---------- main loop ----------
  layout();
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, .05); last = now;
    if (state === 'play' || state === 'win') update(dt);
    render(now); confetti(dt);
    if (state === 'play') timerEl.textContent = ((now - startT) / 1000).toFixed(1) + 's';
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
